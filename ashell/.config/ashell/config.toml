outputs = "All"
position = "Top"
layer = "Bottom"
enable_esc_key = true

[modules]
left = [ "Workspaces" ]
center = [ "WindowTitle" ]
right = ["MediaPlayer", "Tray", [ "Tempo", "Privacy", "Settings" ], "Notifications", "Clipboard"]

[[CustomModule]]
name = "Clipboard"
icon = ""
command = "cliphist list | wofi --dmenu | cliphist decode | wl-copy"

[media_player]
indicator_format = "Icon"

[tempo]
clock_format = "%a %d %b %R"

[notifications]
format = "%H:%M"
show_timestamps = true
show_bodies = true

[settings]
lock_cmd = "playerctl --all-players pause && hyprlock &"
shutdown_cmd = "shutdown now" 
suspend_cmd = "systemctl suspend"
hibernate_cmd = "systemctl hibernate"
reboot_cmd = "systemctl reboot"
logout_cmd = "loginctl kill-user $(whoami)"
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
wifi_more_cmd = "rio -e impala"
vpn_more_cmd = "nm-connection-editor"
bluetooth_more_cmd = "rio -e bluetui"
battery_format = "IconAndPercentage"
peripheral_battery_format = "Icon"
audio_indicator_format = "Icon"
microphone_indicator_format = "Icon"
network_indicator_format = "Icon"
bluetooth_indicator_format = "Icon"
brightness_indicator_format = "Icon"
volume_step = 5
max_volume = 100
indicators = [ "IdleInhibitor", "PowerProfile", "Audio", "Microphone", "Bluetooth", "Network", "Vpn", "Battery", "Brightness" ]

[osd]
enabled = true
timeout = 1500
show_volume_percentage = true
show_brightness_percentage = true

[window_title]
mode = "Title"
truncate_title_after_length = 50

[animations]
enabled = true

[appearance]
style = "Islands"
font_name = "JetBrainsMono Nerd Font Propo"
scale_factor = 0.7           # (default) range: 0.0 < x <= 2.0
opacity = 0.6                # (default) range: 0.0 to 1.0

success_color = "#a6e3a1"
warning_color = "#f9e2af"
danger_color = "#f38ba8"
text_color = "#cdd6f4"

workspace_colors = [ "#fab387", "#b4befe", "#cba6f7" ]

[appearance.primary_color]
base = "#fab387"
text = "#1e1e2e"

[appearance.background_color]
base = "#1e1e2e"
weak = "#313244"
strong = "#45475a"
